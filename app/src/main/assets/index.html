<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#171923"><title>Saku macOS</title>
<style>
:root{--accent:#68a7ff;--glass:rgba(27,31,44,.76);--panel:rgba(28,32,44,.94);--line:rgba(255,255,255,.13);--fg:#f5f7fb;--muted:#b6bfd0}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--fg);background:#171c2a}button,input,textarea,select{font:inherit;color:inherit}button{border:1px solid var(--line);background:#ffffff12;border-radius:10px;padding:8px 11px}button:active{transform:scale(.97)}input,textarea,select{background:#10131c;border:1px solid var(--line);border-radius:9px;padding:10px;width:100%;outline:none}textarea{resize:none;min-height:180px}.wall{position:absolute;inset:0;background:radial-gradient(ellipse at 22% 25%,#5c87c4 0,transparent 35%),radial-gradient(ellipse at 78% 72%,#8a5a9b 0,transparent 38%),linear-gradient(135deg,#121827,#253b5b 55%,#1b172a);background-size:cover;background-position:center}.menubar{position:absolute;z-index:500;top:0;left:0;right:0;height:34px;display:flex;align-items:center;gap:14px;padding:0 12px;background:#10131b9c;backdrop-filter:blur(24px);font-size:12px}.menubar b{font-size:17px}.menubar .right{margin-left:auto;display:flex;gap:12px;align-items:center}.desk{position:absolute;inset:34px 0 0}.desktop-icons{display:grid;grid-template-columns:repeat(2,72px);gap:18px;padding:18px}.appicon{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:5px;padding:5px;font-size:11px;text-shadow:0 1px 4px #000}.glyph{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:linear-gradient(145deg,#ffffff35,#ffffff0b);border:1px solid #ffffff35;font-size:25px;box-shadow:0 6px 20px #0002}.dockwrap{position:absolute;z-index:450;bottom:10px;left:50%;transform:translateX(-50%);max-width:96vw}.dock{display:flex;align-items:end;gap:7px;padding:8px 10px;background:var(--glass);border:1px solid #ffffff38;border-radius:21px;backdrop-filter:blur(28px);box-shadow:0 12px 40px #0006;max-width:94vw;overflow-x:auto}.dock .glyph{width:45px;height:45px;font-size:24px;transition:transform .12s}.dock button:active .glyph{transform:scale(1.18) translateY(-4px)}.dot{width:4px;height:4px;background:#fff;border-radius:50%;margin:auto}.win{position:absolute;z-index:20;left:6%;top:11%;width:88%;height:68%;min-width:240px;min-height:220px;max-width:98%;max-height:85%;background:var(--panel);border:1px solid #ffffff38;border-radius:15px;box-shadow:0 24px 70px #0007;backdrop-filter:blur(32px);overflow:hidden;display:flex;flex-direction:column}.titlebar{height:42px;flex-shrink:0;display:flex;align-items:center;gap:9px;padding:0 12px;background:#ffffff08;border-bottom:1px solid var(--line);touch-action:none}.traffic{display:flex;gap:6px}.traffic button{width:12px;height:12px;border:0;border-radius:50%;padding:0}.red{background:#ff6259}.yellow{background:#ffbd2e}.green{background:#28c840}.wtitle{font-weight:600;flex:1;text-align:center;font-size:13px}.winbody{padding:15px;overflow:auto;flex:1}.winbody h2{font-size:20px;margin:0 0 12px}.winbody p{color:var(--muted)}.row{display:flex;gap:8px;margin:8px 0}.row>*{flex:1}.list{display:flex;flex-direction:column;gap:8px}.item{display:flex;align-items:center;gap:9px;padding:10px;background:#ffffff0a;border:1px solid var(--line);border-radius:10px}.item span{flex:1}.pill{border-radius:999px;padding:4px 8px;background:#ffffff12;color:var(--muted);font-size:11px}.overlay{position:absolute;z-index:300;inset:34px 0 0;background:#090c14a8;backdrop-filter:blur(28px);display:none;padding:22px;overflow:auto}.overlay.show{display:block}.search{max-width:540px;margin:8px auto 22px}.launchgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;max-width:640px;margin:auto}.launchgrid .appicon .glyph{width:54px;height:54px}.control{position:absolute;z-index:520;right:10px;top:40px;width:min(310px,92vw);padding:15px;background:var(--panel);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(30px);display:none;box-shadow:0 15px 45px #0008}.control.show{display:block}.controlgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.control button{min-height:48px}.muted{color:var(--muted)}.accentbtn{background:var(--accent);color:#10131a;border:0}.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.calc .display{grid-column:span 4;text-align:right;font-size:28px;padding:14px}.calc button{font-size:18px;padding:13px 4px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.calendar button{padding:9px 0}.calendar .today{background:var(--accent);color:#111}.termout{white-space:pre-wrap;font:12px ui-monospace,monospace;color:#a8f0be;min-height:90px}.toast{position:absolute;z-index:900;top:45px;left:50%;transform:translateX(-50%);padding:10px 16px;background:#10131beF;border:1px solid var(--line);border-radius:12px;display:none}.small{font-size:12px}.light{--glass:#ffffffb8;--panel:#f2f4f8f2;--fg:#202534;--muted:#5e687a;--line:#66708030}.light input,.light textarea,.light select{background:#fff;color:#222}.light .titlebar{background:#fff5}.light .item{background:#fff7}.hidden{display:none!important}@media(min-width:700px){.win{left:18%;top:12%;width:64%;height:68%}.desktop-icons{grid-template-columns:repeat(1,80px)}.launchgrid{grid-template-columns:repeat(6,1fr)}}
</style></head><body><div id="wall" class="wall"></div><div class="menubar"><b>●</b><strong>Saku</strong><span id="activeMenu">Desktop</span><div class="right"><span id="wifi">⌁</span><span>◖</span><span id="battery">▰</span><span id="topclock"></span><button id="spot" style="padding:2px 6px">⌕</button><button id="cc" style="padding:2px 6px">☷</button></div></div><main class="desk" id="desk"><div class="desktop-icons" id="deskicons"></div></main><div class="overlay" id="launchpad"><input class="search" id="appsearch" placeholder="Cari aplikasi…"><div class="launchgrid" id="launchgrid"></div></div><div class="control" id="control"><h3 style="margin:0 0 12px">Control Center</h3><div class="controlgrid"><button data-toggle="wifi">⌁ Wi-Fi <span class="pill">On</span></button><button data-toggle="bt">ᛒ Bluetooth <span class="pill">On</span></button><button id="darktoggle">◐ Tampilan</button><button id="night">☾ Night Shift</button></div><p class="small muted">Kecerahan tampilan</p><input id="bright" type="range" min="30" max="100" value="100"><p class="small muted">Sakelar Wi-Fi/Bluetooth di sini hanya tampilan; perubahan radio sistem memerlukan izin Android.</p><button id="lock" style="width:100%">Kunci layar (pengaturan)</button></div><div class="dockwrap"><div class="dock" id="dock"></div></div><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const apps=[
{id:'finder',name:'Finder',icon:'📁',desc:'Berkas dan aplikasi'}, {id:'notes',name:'Catatan',icon:'📝'}, {id:'todo',name:'Pengingat',icon:'☑️'}, {id:'calc',name:'Kalkulator',icon:'🧮'}, {id:'clock',name:'Jam',icon:'🕒'}, {id:'calendar',name:'Kalender',icon:'📅'}, {id:'weather',name:'Cuaca',icon:'🌤️'}, {id:'terminal',name:'Terminal',icon:'⌘'}, {id:'settings',name:'Pengaturan',icon:'⚙️'}, {id:'files',name:'File',icon:'🗂️'}, {id:'apps',name:'Aplikasi Android',icon:'📱'}];
let z=30,openWins={},current='Desktop',calcExpr='',clockTimer=null;
const storage={get(k,d=''){try{return localStorage.getItem('saku.'+k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem('saku.'+k,v)}catch(e){}}};
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',1800)}
function iconButton(a,where){let b=document.createElement('button');b.className='appicon';b.innerHTML='<span class="glyph">'+a.icon+'</span><span>'+esc(a.name)+'</span>';b.onclick=()=>launch(a.id);where.appendChild(b);return b}
function initIcons(){let d=$('#dock');d.innerHTML='';['apps','finder','notes','todo','calc','calendar','weather','settings'].forEach(id=>{let a=apps.find(x=>x.id===id);let b=document.createElement('button');b.title=a.name;b.innerHTML='<span class="glyph">'+a.icon+'</span>';b.onclick=()=>launch(id);d.appendChild(b)});let trash=document.createElement('button');trash.title='Sampah';trash.innerHTML='<span class="glyph">🗑️</span>';trash.onclick=()=>toast('Sampah belum terhubung ke penyimpanan Android');d.appendChild(trash);$('#deskicons').innerHTML='';['finder','apps','notes','todo'].forEach(id=>iconButton(apps.find(a=>a.id===id),$('#deskicons')));renderLaunch()}
function renderLaunch(q=''){let g=$('#launchgrid');g.innerHTML='';apps.filter(a=>a.name.toLowerCase().includes(q.toLowerCase())).forEach(a=>iconButton(a,g));if(window.SakuAndroid){try{let raw=window.SakuAndroid.getApps();JSON.parse(raw||'[]').filter(a=>(a.label||'').toLowerCase().includes(q.toLowerCase())).slice(0,120).forEach(a=>{let b=document.createElement('button');b.className='appicon';b.innerHTML='<span class="glyph">📲</span><span>'+esc(a.label)+'</span>';b.onclick=()=>window.SakuAndroid.launchApp(a.packageName);g.appendChild(b)})}catch(e){}}}
function showLaunch(){ $('#launchpad').classList.toggle('show');$('#control').classList.remove('show');$('#appsearch').value='';renderLaunch();if($('#launchpad').classList.contains('show'))$('#appsearch').focus()}
$('#appsearch').addEventListener('input',e=>renderLaunch(e.target.value));$('#spot').onclick=showLaunch;$('#cc').onclick=()=>{$('#control').classList.toggle('show');$('#launchpad').classList.remove('show')};
function launch(id){if(id==='apps'){showLaunch();return}if(id==='finder')id='files';if(openWins[id]){openWins[id].style.display='flex';openWins[id].style.zIndex=++z;return}let a=apps.find(x=>x.id===id)||{name:id,icon:'📦'};let w=document.createElement('section');w.className='win';w.style.zIndex=++z;w.dataset.app=id;w.innerHTML='<header class="titlebar"><div class="traffic"><button class="red" aria-label="Tutup"></button><button class="yellow" aria-label="Minimalkan"></button><button class="green" aria-label="Maksimalkan"></button></div><div class="wtitle">'+a.icon+' '+esc(a.name)+'</div><button class="closex" style="padding:2px 8px">⋯</button></header><div class="winbody">'+contentFor(id)+'</div>';$('#desk').appendChild(w);openWins[id]=w;w.querySelector('.red').onclick=()=>{w.remove();delete openWins[id]};w.querySelector('.yellow').onclick=()=>w.style.display='none';w.querySelector('.green').onclick=()=>{if(w.dataset.max==='1'){w.style.cssText='';w.style.zIndex=++z;w.dataset.max='0'}else{w.style.left='1%';w.style.top='4%';w.style.width='98%';w.style.height='84%';w.style.zIndex=++z;w.dataset.max='1'}};w.querySelector('.closex').onclick=()=>toast(a.name+' · menu');let bar=w.querySelector('.titlebar');bar.ondblclick=()=>w.querySelector('.green').click();bar.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;w.style.zIndex=++z;let r=w.getBoundingClientRect(),sx=e.clientX,sy=e.clientY,l=r.left,t=r.top;bar.setPointerCapture(e.pointerId);const move=ev=>{w.style.left=Math.max(0,Math.min(innerWidth-r.width,l+ev.clientX-sx))+'px';w.style.top=Math.max(34,Math.min(innerHeight-90,t+ev.clientY-sy))+'px'};const end=()=>{bar.removeEventListener('pointermove',move);bar.removeEventListener('pointerup',end)};bar.addEventListener('pointermove',move);bar.addEventListener('pointerup',end)});w.onpointerdown=()=>w.style.zIndex=++z;wire(id,w.querySelector('.winbody'));$('#activeMenu').textContent=a.name}
function contentFor(id){switch(id){case'notes':return '<h2>Catatan</h2><textarea id="notesText" placeholder="Tulis ide kamu…">'+esc(storage.get('notes'))+'</textarea><p class="small">Tersimpan otomatis di perangkat.</p>';case'todo':return '<h2>Pengingat</h2><div class="row"><input id="todoInput" placeholder="Tambah tugas…"><button id="todoAdd" class="accentbtn">Tambah</button></div><div id="todoList" class="list"></div>';case'calc':return '<div class="calc"><input class="display" id="calcDisplay" readonly value="0">'+['AC','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','=','⌫'].map(x=>'<button data-calc="'+x+'">'+x+'</button>').join('')+'</div>';case'clock':return '<h2 id="clockBig" style="font-size:40px">--:--:--</h2><p>'+new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</p><hr><h3>Stopwatch</h3><div id="stopwatch">00:00.0</div><button id="swStart">Mulai / Jeda</button><button id="swReset">Reset</button>';case'calendar':return '<h2>Kalender</h2><div id="monthLabel"></div><div class="calendar" id="calendarGrid"></div><h3>Tambah acara</h3><input id="eventDate" type="date"><div class="row"><input id="eventText" placeholder="Nama acara"><button id="eventAdd">Simpan</button></div><div id="eventList" class="list"></div>';case'weather':return '<h2>Cuaca</h2><p>Cuaca saat ini menggunakan Open-Meteo gratis.</p><div class="row"><input id="city" placeholder="Kota, contoh Kediri" value="Kediri"><button id="weatherGo" class="accentbtn">Cari</button></div><div id="weatherResult" class="item">Tekan Cari untuk mengambil cuaca.</div><p class="small muted">Memerlukan koneksi internet. Lokasi dicari melalui layanan geocoding publik.</p>';case'terminal':return '<h2>Terminal Saku</h2><div id="termout" class="termout">Saku Shell · simulasi aman di dalam launcher\nKetik help untuk perintah.</div><div class="row"><input id="termcmd" placeholder="help"><button id="termgo">Jalankan</button></div><p class="small muted">Tidak menjalankan shell Android asli. Untuk Termux, buka aplikasi Termux dari Launchpad.</p>';case'settings':return '<h2>Pengaturan</h2><h3>Tampilan</h3><div class="row"><button id="themeBtn">Terang / Gelap</button><button id="wallBtn">Ganti wallpaper</button></div><p>Warna aksen</p><div class="row">'+['#68a7ff','#ff7e9f','#8de0b1','#d1a0ff','#ffbf69'].map(c=>'<button data-accent="'+c+'" style="background:'+c+';height:38px"></button>').join('')+'</div><p>Ukuran Dock</p><input type="range" id="dockSize" min="35" max="62" value="45"><button id="resetData">Reset data lokal</button><hr><p class="small muted">Pengaturan tampilan launcher. Pengaturan radio dan kecerahan sistem tetap dikontrol Android.</p>';case'files':return '<h2>Finder</h2><p>Selamat datang di Saku Desktop.</p><div class="list"><div class="item">📱 <span>Aplikasi Android</span><button id="openAndroidApps">Buka</button></div><div class="item">📝 <span>Catatan lokal</span><button id="openNotes">Buka</button></div><div class="item">⚙️ <span>Pengaturan launcher</span><button id="openSettings">Buka</button></div></div><p class="small muted">Akses berkas Android penuh memerlukan pemilih berkas atau integrasi native.</p>';default:return '<h2>'+esc(id)+'</h2><p>Aplikasi Saku</p>'}}
function wire(id,b){if(id==='notes'){let t=b.querySelector('#notesText');t.oninput=()=>storage.set('notes',t.value)}if(id==='todo'){const key='todos';function draw(){let arr;try{arr=JSON.parse(storage.get(key,'[]'))}catch(e){arr=[]}b.querySelector('#todoList').innerHTML=arr.map((x,i)=>'<div class="item"><input type="checkbox" data-done="'+i+'" '+(x.done?'checked':'')+' style="width:auto"><span style="'+(x.done?'text-decoration:line-through;opacity:.6':'')+'">'+esc(x.text)+'</span><button data-del="'+i+'">×</button></div>').join('');b.querySelectorAll('[data-done]').forEach(x=>x.onchange=()=>{arr[+x.dataset.done].done=x.checked;storage.set(key,JSON.stringify(arr));draw()});b.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{arr.splice(+x.dataset.del,1);storage.set(key,JSON.stringify(arr));draw()})}b.querySelector('#todoAdd').onclick=()=>{let i=b.querySelector('#todoInput');if(!i.value.trim())return;let a=JSON.parse(storage.get(key,'[]'));a.push({text:i.value.trim(),done:false});storage.set(key,JSON.stringify(a));i.value='';draw()};draw()}if(id==='calc'){let d=b.querySelector('#calcDisplay');b.querySelectorAll('[data-calc]').forEach(x=>x.onclick=()=>{let v=x.dataset.calc;if(v==='AC'){calcExpr='';d.value='0'}else if(v==='⌫'){calcExpr=calcExpr.slice(0,-1);d.value=calcExpr||'0'}else if(v==='='){try{let safe=calcExpr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'/100');if(!/^[0-9+*/(). -]+$/.test(safe))throw 0;d.value=String(Function('return ('+safe+')')());calcExpr=d.value}catch(e){d.value='Error';calcExpr=''}}else if(v==='±'){calcExpr=calcExpr.startsWith('-')?calcExpr.slice(1):'-'+calcExpr;d.value=calcExpr}else{calcExpr+=v;d.value=calcExpr}})}if(id==='clock'){let start=0,elapsed=0,timer=null;const update=()=>{let n=Date.now(),s=Math.floor((n-start+elapsed)/1000),ms=Math.floor(((n-start+elapsed)%1000)/100);b.querySelector('#stopwatch').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+'.'+ms};b.querySelector('#swStart').onclick=()=>{if(timer){elapsed+=Date.now()-start;clearInterval(timer);timer=null}else{start=Date.now();timer=setInterval(update,100)}};b.querySelector('#swReset').onclick=()=>{if(timer)clearInterval(timer);timer=null;elapsed=0;update()};let tick=()=>b.querySelector('#clockBig').textContent=new Date().toLocaleTimeString('id-ID');tick();setInterval(tick,1000)}if(id==='calendar'){let now=new Date(),y=now.getFullYear(),m=now.getMonth();b.querySelector('#eventDate').value=new Date().toISOString().slice(0,10);let draw=()=>{b.querySelector('#monthLabel').textContent=new Date(y,m,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'});let g=b.querySelector('#calendarGrid');g.innerHTML='';['M','S','S','R','K','J','S'].forEach(x=>g.innerHTML+='<div class="small muted" style="text-align:center">'+x+'</div>');let offset=(new Date(y,m,1).getDay()+6)%7;for(let i=0;i<offset;i++)g.innerHTML+='<span></span>';for(let day=1;day<=new Date(y,m+1,0).getDate();day++){let bt=document.createElement('button');bt.textContent=day;if(day===new Date().getDate()&&m===new Date().getMonth()&&y===new Date().getFullYear())bt.className='today';bt.onclick=()=>b.querySelector('#eventDate').value=y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');g.appendChild(bt)};let ev=JSON.parse(storage.get('events','[]'));b.querySelector('#eventList').innerHTML=ev.map(e=>'<div class="item"><span>'+esc(e.date)+' · '+esc(e.text)+'</span></div>').join('')};b.querySelector('#eventAdd').onclick=()=>{let t=b.querySelector('#eventText'),d=b.querySelector('#eventDate');if(!t.value.trim())return;let ev=JSON.parse(storage.get('events','[]'));ev.push({date:d.value,text:t.value.trim()});storage.set('events',JSON.stringify(ev));t.value='';draw()};draw()}if(id==='weather'){b.querySelector('#weatherGo').onclick=async()=>{let city=b.querySelector('#city').value.trim();let out=b.querySelector('#weatherResult');out.textContent='Mengambil data…';try{let g=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=1&language=id&format=json').then(r=>r.json());if(!g.results?.length)throw Error('Kota tidak ditemukan');let p=g.results[0],w=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+p.latitude+'&longitude='+p.longitude+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m').then(r=>r.json()),c=w.current;out.innerHTML='<span>🌡️</span><span><b>'+esc(p.name)+': '+c.temperature_2m+'°C</b><br><small class="muted">Terasa '+c.apparent_temperature+'°C · Kelembapan '+c.relative_humidity_2m+'% · Angin '+c.wind_speed_10m+' km/j</small></span>'}catch(e){out.textContent='Gagal mengambil cuaca: '+e.message+' (periksa internet)'}}}if(id==='terminal'){let out=b.querySelector('#termout'),cmd=b.querySelector('#termcmd');const run=()=>{let c=cmd.value.trim();let result={'help':'Perintah: help, date, open notes, open todo, open calc, open settings, theme dark, theme light, clear','date':new Date().toString(),'clear':''}[c];if(c==='open notes'){launch('notes');result='Membuka Catatan'}else if(c==='open todo'){launch('todo');result='Membuka Pengingat'}else if(c==='open calc'){launch('calc');result='Membuka Kalkulator'}else if(c==='open settings'){launch('settings');result='Membuka Pengaturan'}else if(c==='theme dark'||c==='theme light'){document.body.classList.toggle('light',c.endsWith('light'));result='Tema diperbarui'}else if(result===undefined)result='Perintah tidak dikenal: '+c;out.textContent+='$ '+c+'\n'+result+'\n';cmd.value='';out.scrollTop=out.scrollHeight};b.querySelector('#termgo').onclick=run;cmd.onkeydown=e=>{if(e.key==='Enter')run()}}if(id==='settings'){b.querySelector('#themeBtn').onclick=()=>{document.body.classList.toggle('light');storage.set('theme',document.body.classList.contains('light')?'light':'dark')};b.querySelector('#wallBtn').onclick=()=>{let colors=['linear-gradient(135deg,#14223b,#516ea2,#5d416f)','radial-gradient(at 20% 20%,#bd658c,#1d2443 65%)','linear-gradient(135deg,#071d20,#247a70,#101b30)','linear-gradient(135deg,#18122b,#754aa0,#17264b)'];let i=+(storage.get('wall','0'));i=(i+1)%colors.length;storage.set('wall',i);$('#wall').style.background=colors[i]};b.querySelectorAll('[data-accent]').forEach(x=>x.onclick=()=>{document.documentElement.style.setProperty('--accent',x.dataset.accent);storage.set('accent',x.dataset.accent)});b.querySelector('#dockSize').oninput=e=>{$$('.dock .glyph').forEach(x=>{x.style.width=e.target.value+'px';x.style.height=e.target.value+'px'})};b.querySelector('#resetData').onclick=()=>{if(confirm('Hapus catatan, tugas, acara, dan preferensi lokal?')){Object.keys(localStorage).filter(k=>k.startsWith('saku.')).forEach(k=>localStorage.removeItem(k));toast('Data lokal direset')}}}if(id==='files'){b.querySelector('#openAndroidApps').onclick=showLaunch;b.querySelector('#openNotes').onclick=()=>launch('notes');b.querySelector('#openSettings').onclick=()=>launch('settings')}}
