name: Integrate Display Extend
on:
  push:
    branches:
      - work/integrate-display-extend
    paths:
      - ".github/workflows/integrate-display-extend.yml"
      - "tools/integrate_display_extend.sh"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: display-extend-integration
  cancel-in-progress: true
jobs:
  integrate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: work/integrate-display-extend
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install required Android SDK packages
        run: yes | sdkmanager --licenses >/dev/null; sdkmanager "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;36.0.0"
      - name: Run integration script
        run: bash tools/integrate_display_extend.sh
      - name: Commit integrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app settings.gradle.kts build.gradle.kts hidden-api-stub
          if git diff --cached --quiet; then
            echo "No integration changes produced"
            exit 1
          fi
          git commit -m "Integrate Android Display Extend into SakuLauncher"
          git push origin HEAD:work/integrate-display-extend
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SakuLauncher-DisplayExtend-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
